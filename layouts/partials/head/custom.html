<style>
    :root {
        --article-font-family: "Noto Serif SC", var(--base-font-family);
    }
</style>

<script> //正文字重300，标题字重700
		(function () {
		    const customFont = document.createElement('link');
		    customFont.href = "https://fonts.bunny.net/css2?family=Noto+Serif+SC:wght@300;700&display=swap"; 
		    customFont.type = "text/css";
		    customFont.rel = "stylesheet";
		
		    document.head.appendChild(customFont);
		}());
</script>
{{ if .Site.Params.google_site_verification }}
<meta name="google-site-verification" content="{{ .Site.Params.google_site_verification }}" />
{{ end }}

{{ if .Site.Params.bing_site_verification }}
<meta name="msvalidate.01" content="{{ .Site.Params.bing_site_verification }}" />
{{ end }}
<script src="https://fastly.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/autoload.js"></script>
